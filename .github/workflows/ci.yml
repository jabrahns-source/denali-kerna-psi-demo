name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax check pages
        run: node --check pages/index.js && node --check pages/api/caiso.js
      - name: receipt tests
        run: node --test tests/test_receipt.mjs
